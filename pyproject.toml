[project]
name = "study-rats"
description = "Study Rats — plataforma de simulados de estudo com IA e repetição espaçada."
requires-python = ">=3.12, <3.15"

dependencies = [
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "alembic>=1.13.0",
    "python-multipart>=0.0.9",
    "pydantic[email]>=2.9.0",
]

dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools.dynamic]
version = {file = "version.txt"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` como valor padrão de parâmetro é o padrão idiomático do
# FastAPI para injeção de dependências, não um bug (B008).
"src/api/**/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]