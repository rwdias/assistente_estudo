[pytest]
# a suíte importa helpers.py/conftest.py de dentro de tests/
testpaths = tests
pythonpath = tests

markers =
    db: toca funções SQL / dados (usuário descartável)
    rls: testes adversariais de segurança (rodar após mudar policy/função)
    edge: contrato das Edge Functions, sem IA
    ai: chama provedor de IA (custa quota/tokens) — opt-in
    e2e: Playwright, lento — opt-in

# padrão: só o barato e determinístico. Use `-m ai` / `-m e2e` para os demais.
addopts = -m "not ai and not e2e" -q
